name: LLM Pricing Update

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-pricing:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install anthropic

      - name: Run LLM Pricing Tracker Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'EOF'
          import anthropic

          client = anthropic.Anthropic()

          session = client.beta.sessions.create(
              agent="ag_01FUBHf7vKMQ6EM7kKEswtjp",
              environment_id="env_01B6Hn4X4d7soRPUNnjmoT4A",
              vault_ids=["vlt_011CZwiqKEjCEEq7PfdLYt3Y"],
              title="Weekly pricing update",
              betas=["managed-agents-2026-04-01"],
          )

          client.beta.sessions.events.send(
              session_id=session.id,
              events=[{
                  "type": "user.message",
                  "content": [{
                      "type": "text",
                      "text": "Search for the latest 2026 pricing for Anthropic, OpenAI, and Mistral models, mark legacy models, and commit updated model cards to the repo."
                  }]
              }],
              betas=["managed-agents-2026-04-01"],
          )

          with client.beta.sessions.events.stream(
              session_id=session.id,
              betas=["managed-agents-2026-04-01"],
          ) as stream:
              for event in stream:
                  if getattr(event, "type", None) == "session.status_idle":
                      print("Agent finished.")
                      break

          client.beta.sessions.archive(
              session.id,
              betas=["managed-agents-2026-04-01"],
          )

          print("Done.")
          EOF
